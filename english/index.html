<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>영어 회화 30분</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap">
<style>
/* Layout: one reading column (max 760px). Home = today's course card + progress notes.
   Lesson = sticky course bar (timer + six numbered steps), one step panel at a time. */
:root{
  --paper:#F1F4F5; --card:#FFFFFF; --ink:#17212A; --muted:#566370; --line:#D3DBDF;
  --ai:#0F6A63; --ai-ink:#FFFFFF; --ai-soft:#DCEEEB;
  --matcha:#4C6A1C; --matcha-soft:#E6EDD6;
  --shu:#A3402D; --shu-soft:#F6E2DC;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-tx:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1417; --card:#151D21; --ink:#E2E8EA; --muted:#93A2A8; --line:#26333A;
    --ai:#6CC2B8; --ai-ink:#0B1715; --ai-soft:#17302D;
    --matcha:#A9C76F; --matcha-soft:#222C14;
    --shu:#E8907B; --shu-soft:#36211C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1417; --card:#151D21; --ink:#E2E8EA; --muted:#93A2A8; --line:#26333A;
  --ai:#6CC2B8; --ai-ink:#0B1715; --ai-soft:#17302D;
  --matcha:#A9C76F; --matcha-soft:#222C14;
  --shu:#E8907B; --shu-soft:#36211C; color-scheme:dark;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:grid;gap:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tx{font-family:var(--f-tx);font-size:1.12rem;line-height:1.6}
.disp{font-family:var(--f-display);font-weight:600}
.ko{font-size:.9rem;color:var(--muted)}
.hide-ko .ko{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:10px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ai)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.big{padding:13px 22px;font-size:1rem}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.on{background:var(--ai-soft);border-color:var(--ai)}
.play{appearance:none;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ai)}
.play:hover{border-color:var(--ai)}
.play svg{width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.8rem;background:var(--ai-soft);color:var(--ink)}
.chip.warn{background:var(--shu-soft)}
.chip.good{background:var(--matcha-soft)}
.notice{border-radius:10px;padding:10px 12px;background:var(--ai-soft);font-size:.9rem}
.notice.warn{background:var(--shu-soft)}
.notice.good{background:var(--matcha-soft)}

/* home */
.hero{gap:14px}
.hero .disp{font-size:1.05rem;color:var(--muted)}
.course{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.course li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.course .num{font-family:var(--f-display);font-size:1.1rem;color:var(--ai)}
.course .nm{font-weight:600;font-size:.9rem}
.course .mn{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){.course{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:.78rem;color:var(--muted)}
.spark{width:100%;height:64px;display:block}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.hist li:first-child{border-top:0}
.hist .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .s{flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}

/* lesson bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px 8px;display:grid;gap:8px}
.bar-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:.92rem}
.timer{flex:none;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.timer b{color:var(--ink);font-weight:600}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.step .n{font-family:var(--f-display);color:var(--ai)}
.step.cur{border-color:var(--ai);background:var(--ai-soft)}
.step.done .n::after{content:" ✓";font-family:var(--f-ui);color:var(--matcha)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}

/* lines */
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.line.me{background:var(--ai-soft);border-color:transparent}
.line.now{outline:2px solid var(--ai);outline-offset:1px}
.who{font-size:.72rem;color:var(--muted);writing-mode:horizontal-tb;padding-top:5px;min-width:2.6em;text-align:center;line-height:1.25}
.who .jn{font-family:var(--f-tx);font-size:.82rem;color:var(--ink);display:block}
.veil .line:not(.open) .tx,.veil .line:not(.open) .ko{filter:blur(7px);user-select:none}
.veil .line:not(.open){cursor:pointer}
.reps{display:flex;gap:4px;margin-top:6px}
.rep{appearance:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.7rem;color:var(--muted)}
.rep.on{background:var(--matcha);border-color:var(--matcha);color:var(--card)}
.expr{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.expr:first-child{border-top:0;padding-top:0}
.expr .note{font-size:.88rem}
.grammar{background:var(--ai-soft);border-radius:10px;padding:14px;display:grid;gap:8px}

/* flashcard */
.flash{border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:10px;text-align:center;justify-items:center}
.flash .ko{font-size:1.15rem;color:var(--ink)}
.flash .tx{font-size:1.3rem}

/* quiz */
.q{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q-h{display:flex;gap:8px;align-items:baseline}
.q-n{font-family:var(--f-display);color:var(--ai);flex:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--ai)}
.opt.right{background:var(--matcha-soft);border-color:var(--matcha)}
.opt.wrong{background:var(--shu-soft);border-color:var(--shu)}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-family:var(--f-tx);font-size:1.02rem;line-height:1.6}
textarea:focus{outline:2px solid var(--ai);outline-offset:0;border-color:transparent}

/* chat */
.chat{display:grid;gap:10px}
.bub{max-width:88%;border-radius:14px;padding:10px 13px;display:grid;gap:4px;min-width:0}
.bub.them{background:var(--card);border:1px solid var(--line);justify-self:start}
.bub.mine{background:var(--ai-soft);justify-self:end}
.bub .row{gap:6px}
.say{border-left:3px solid var(--matcha);padding:4px 10px;font-size:.88rem;display:grid;gap:2px}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.goals li{font-size:.9rem;display:flex;gap:8px}
.goals li::before{content:"○";color:var(--muted)}
.goals li.ok::before{content:"●";color:var(--matcha)}
.think{color:var(--muted);font-size:.9rem}

/* result */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvl{font-size:1.05rem}
.lvl b{font-variant-numeric:tabular-nums}
.fix{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.fix:first-child{border-top:0;padding-top:0}
.fix .wrong{text-decoration:line-through;text-decoration-color:var(--shu);color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.line,.opt,.btn,.step{transition:background-color .15s,border-color .15s}}
</style>
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
details summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
'use strict';

/* ---------- constants ---------- */

const STEPS = [
  {key:'review', num:'1', name:'복습',     min:3, desc:'지난 표현 떠올리기'},
  {key:'listen', num:'2', name:'듣기',     min:7, desc:'대화문을 귀로 먼저'},
  {key:'expr',   num:'3', name:'표현·문법', min:5, desc:'다시 쓸 표현 익히기'},
  {key:'shadow', num:'4', name:'쉐도잉',   min:5, desc:'듣고 바로 따라 말하기'},
  {key:'role',   num:'5', name:'롤플레이', min:7, desc:'글로 하는 실전 대화'},
  {key:'test',   num:'6', name:'테스트',   min:3, desc:'채점 후 결과 보내기'}
];
const SKILLS = ['듣기','어휘','표현','전치사·관사','시제·동사','공손함','작문'];
const LEVEL_BANDS = [
  {max:2.5, label:'입문',   cefr:'A1', guide:'문장 4~7단어, 현재형·can·want·Can I have ~?, 아주 흔한 단어만, 대화 6~8줄'},
  {max:4.5, label:'초중급', cefr:'A2', guide:"문장 6~12단어, 과거·미래형, Could I/Could you/I'd like, wh-질문, if possible 같은 완충 표현, 대화 8~10줄"},
  {max:6.5, label:'중급',   cefr:'B1', guide:'문장 10~16단어, 이유·조건(because, if, so that), 흔한 구동사(check in, run out of), 의견·감상, 대화 10~12줄'},
  {max:8.5, label:'중상급', cefr:'B2', guide:'완곡 표현(I was wondering if, It might be better to), 뉘앙스 차이, 맥락 속 관용 표현, 대화 12~14줄'},
  {max:99,  label:'상급',   cefr:'C1', guide:'자연스러운 구어 축약·맞장구·유머, 설득과 화제 전환, 빠른 화자, 대화 12~16줄'}
];
const band = lv => LEVEL_BANDS.find(b => lv < b.max) || LEVEL_BANDS[LEVEL_BANDS.length - 1];
const SRS_DAYS = [1, 2, 4, 8, 16];

/* ---------- utils ---------- */

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pad = n => String(n).padStart(2, '0');
const todayStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function addDays(str, n) { const [y, m, d] = str.split('-').map(Number); return todayStr(new Date(y, m - 1, d + n)); }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const fmtLv = v => (Math.round(v * 100) / 100).toFixed(2).replace(/0$/, '').replace(/\.0$/, '');
function seededOrder(n, seed) {
  let s = 2166136261;
  for (const ch of seed) s = Math.imul(s ^ ch.charCodeAt(0), 16777619) >>> 0;
  const idx = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}

function errText(e) { return (e && e.message) ? String(e.message) : '알 수 없는 오류가 났어요.'; }
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem('en30x:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('en30x:' + k, JSON.stringify(v)); } catch {} }
};
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l9-5.5z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect fill="currentColor" x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>';
function icon(svg) { const s = document.createElement('span'); s.innerHTML = svg; s.style.display = 'contents'; return s; }

/* ---------- server data (GitHub Pages, 매일 밤 자동화가 갱신) ---------- */
async function fetchJSON(p) {
  const r = await fetch(p + (p.includes('?') ? '&' : '?') + 'v=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(`${p} 를 불러오지 못했어요 (${r.status})`);
  return r.json();
}
const lessonCache = {};
async function getLesson(id) {
  if (!lessonCache[id]) lessonCache[id] = await fetchJSON('data/lessons/' + id + '.json');
  return lessonCache[id];
}

/* ---------- result relay (ntfy) ---------- */
// 결과는 ntfy 토픽으로 보내고, 매일 밤 자동화가 거둬 간다. ntfy 는 메시지를 12시간만 들고 있어서
// 아직 반영되지 않은 결과는 앱을 열 때마다 10시간 간격으로 다시 보낸다(중복은 밤 작업이 걸러 낸다).
const RESEND_MS = 10 * 3600e3;
async function sendResult(rec) {
  if (!S.config) throw new Error('설정을 불러오지 못했어요.');
  const body = JSON.stringify(rec.payload), size = 1200, of = Math.ceil(body.length / size);
  const url = S.config.relay.replace(/\/$/, '') + '/' + S.config.topic;
  for (let i = 0; i < of; i++) {
    const r = await fetch(url, {method: 'POST', body: JSON.stringify({id: rec.payload.id, part: i, of, d: body.slice(i * size, (i + 1) * size)})});
    if (!r.ok) throw new Error('전송 실패 (' + r.status + ')');
  }
  rec.sentAt = Date.now(); saveLocal();
}
async function flushOutbox(force) {
  const processed = new Set((S.profile && S.profile.processed) || []);
  for (const rec of Object.values(S.local.results)) {
    if (processed.has(rec.id)) { rec.acked = true; delete rec.payload; continue; }
    if (!rec.payload || (!force && rec.sentAt && Date.now() - rec.sentAt < RESEND_MS)) continue;
    try { await sendResult(rec); } catch (e) { rec.error = errText(e); }
  }
  saveLocal();
}

/* ---------- state ---------- */
const S = {
  mode: 'loading', loadError: null, config: null,
  profile: null, index: [], lesson: null,
  local: {results: LS.get('results', {}), cards: LS.get('cards', {})},
  view: 'home', step: 0, session: null, finishing: false,
  prefs: Object.assign({ko: true, rate: 0.9, autoplay: true}, LS.get('prefs', {}))
};
const savePrefs = () => LS.set('prefs', S.prefs);
const saveLocal = () => { LS.set('results', S.local.results); LS.set('cards', S.local.cards); };
const saveDraft = () => { if (S.session) LS.set('draft', {lessonId: S.session.lessonId, step: S.step, session: S.session}); };
function defaultProfile() {
  return {level: 3.5, startedAt: todayStr(), streak: 0, lastDoneDate: null, completed: 0, totalMinutes: 0,
    skillStats: {}, recentMistakes: [], levelHistory: [], coachNote: '', focus: [], done: {}, processed: []};
}
function newSession() {
  return {
    startedAt: Date.now(), steps: {},
    review: {i: 0, shown: false, total: 0, known: 0, queue: null},
    listen: {veil: false},
    shadow: {reps: {}, mode: 'me'},
    role: {i: 0, replies: [], draft: '', hint: false, goalsSelf: []},
    quiz: {answers: {}, produce: {}, graded: null, selfGrade: {}}
  };
}
function weakSkills(P) {
  return Object.entries(P.skillStats || {})
    .filter(([, v]) => v.n >= 1.5 && v.wrong / v.n >= 0.3)
    .sort((a, b) => b[1].wrong / b[1].n - a[1].wrong / a[1].n)
    .slice(0, 3).map(([k]) => k);
}
const localDone = id => Object.values(S.local.results).some(r => r.lessonId === id);
const isDone = id => !!((S.profile.done || {})[id]) || localDone(id);
const pending = () => Object.values(S.local.results).filter(r => !r.acked).sort((a, b) => a.completedAt < b.completedAt ? -1 : 1);

/* ---------- boot / load ---------- */
async function boot() {
  TTS.init();
  render();
  try { await loadAll(); S.mode = 'ready'; } catch (e) { S.loadError = errText(e); S.mode = 'error'; }
  render();
  if (S.mode === 'ready') { await flushOutbox(false); render(); }
}
async function loadAll() {

const TTS = {
  ok: 'speechSynthesis' in window, en: [],
  init() {
    if (!this.ok) return;
    const load = () => { this.en = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang)); };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch {}
  },
  pick(role) {
    const all = this.en; if (!all.length) return null;
    const us = all.filter(x => /^en[-_]US/i.test(x.lang)), v = us.length ? us : all;
    const pref = role === 'me' ? ['Alex','Aaron','Tom','Fred','Google US English'] : ['Samantha','Ava','Allison','Google US English','Karen'];
    for (const p of pref) { const f = v.find(x => x.name.includes(p)); if (f) return f; }
    return v[role === 'me' && v.length > 1 ? 1 : 0];
  },
  speak(text, role = 'partner', rate) {
    return new Promise(res => {
      if (!this.ok || !text) return res(false);
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      const v = this.pick(role); if (v) u.voice = v;
      u.rate = rate || S.prefs.rate;
      let done = false;
      const fin = ok => { if (!done) { done = true; clearTimeout(t); res(ok); } };
      const t = setTimeout(() => fin(true), 4000 + text.length * 400 / u.rate);
      u.onend = () => fin(true); u.onerror = () => fin(false);
      speechSynthesis.speak(u);
    });
  },
  stop() { if (this.ok) speechSynthesis.cancel(); }
};

function sparkline(hist) {
  const W = 300, H = 64, pad = 6;
  const vals = hist.map(x => Number(x.level) || 0);
  const lo = Math.min(...vals) - 0.25, hi = Math.max(...vals) + 0.25;
  const x = i => pad + i * (W - 2 * pad) / (vals.length - 1);
  const y = v => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'spark'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `레벨 변화 ${vals[0]}에서 ${vals[vals.length - 1]}`);
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--ai)" stroke-width="2" stroke-linejoin="round"/>` +
    `<circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3.5" fill="var(--ai)"/>` +
    `<text x="${W - pad}" y="12" text-anchor="end" font-size="11" fill="var(--muted)">Lv ${fmtLv(vals[vals.length - 1])}</text>`;
  return svg;
}

        h('div', {class: 'stat'}, h('b', {text: String((p.roleplay && p.roleplay.turns.length) || 0)}), h('span', {text: '롤플레이 답'})),
        h('div', {class: 'stat'}, h('b', {text: `${p.stepsDone || 0}/6`}), h('span', {text: '한 단계'}))),
      h('div', {class: 'notice ' + (r.error && !r.sentAt ? 'warn' : 'good') + ' small', text: r.error && !r.sentAt
        ? '결과를 아직 보내지 못했어요. 인터넷이 연결되면 홈에서 다시 보내기를 눌러 주세요.'
        : '결과를 보냈어요. 오늘 밤 11시에 작문·롤플레이를 채점하고, 레벨을 조정하고, 내 약점에 맞춘 다음 레슨을 올려 둘게요.'})),
    h('section', {class: 'card'}, h('h2', {text: '다음 레슨'}),
      S.lesson ? h('div', {class: 'stack'}, h('p', null, h('b', {text: S.lesson.title})), h('p', {class: 'small muted', text: `${S.lesson.theme} · Lv ${fmtLv(S.lesson.level)} · ${S.lesson.scene}`}))
        : h('p', {class: 'small muted', text: '준비된 레슨을 다 했어요. 다음 레슨은 오늘 밤 11시에 올라와요.'}),
      h('div', {class: 'row'}, h('button', {class: 'btn', type: 'button', text: '홈으로', onclick: () => { S.view = 'home'; render(); window.scrollTo(0, 0); }}))));
}


boot();
})();
</script>
</body>
</html>
